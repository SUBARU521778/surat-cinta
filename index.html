<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Me For You ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7d6e0;
            background: linear-gradient(135deg, #fcebeb 0%, #f7d6e0 100%);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Elemen Hati Melayang di Background */
        .bg-heart {
            position: absolute;
            color: rgba(242, 139, 157, 0.4);
            font-size: 20px;
            user-select: none;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Container Utama */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Surat / Amplop Target */
        .target-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 25%;
            transition: all 0.5s ease;
        }

        .envelope {
            width: 140px;
            height: 90px;
            background-color: #ffb6c1;
            border: 3px solid #d05270;
            border-radius: 6px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            border-left: 70px solid transparent;
            border-right: 70px solid transparent;
            border-top: 45px solid #f28b9d;
        }

        .heart-seal {
            font-size: 22px;
            z-index: 2;
            margin-top: 5px;
        }

        .envelope-text {
            margin-top: 15px;
            color: #d05270;
            font-weight: bold;
            font-size: 14px;
        }

        /* Busur dan Anak Panah */
        .bow-section {
            position: absolute;
            bottom: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .bow-wrapper {
            position: relative;
            width: 90px;
            height: 40px;
            display: flex;
            justify-content: center;
        }

        .bow-arc {
            width: 80px;
            height: 35px;
            border: 4px solid #8b4513;
            border-bottom: none;
            border-radius: 80px 80px 0 0;
            position: absolute;
            top: 0;
        }

        .string {
            width: 80px;
            height: 2px;
            background-color: #444;
            position: absolute;
            bottom: 5px;
        }

        .arrow {
            width: 4px;
            height: 60px;
            background-color: #8b4513;
            position: absolute;
            bottom: 5px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .arrow::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -6px;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #e63946;
        }

        .click-hint {
            margin-top: 20px;
            font-size: 12px;
            color: #b5651d;
            font-weight: bold;
        }

        /* Kartu Pesan (Pop-up Rahasia) */
        .card-popup {
            display: none;
            width: 320px;
            background-color: #fff0f3;
            border: 3px solid #ff758f;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: absolute;
            z-index: 10;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-popup h2 {
            font-size: 18px;
            color: #c9184a;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .cat-gif {
            font-size: 45px;
            margin: 15px 0;
            user-select: none;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            min-height: 45px;
        }

        .btn {
            padding: 8px 22px;
            border: 2px solid #ff758f;
            background-color: white;
            color: #c9184a;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .btn-yes {
            background-color: #ff758f;
            color: white;
            border: none;
        }

        .btn-no {
            position: absolute;
            right: 20px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- Background Hati -->
    <div id="hearts-bg"></div>

    <div class="main-wrapper">
        <!-- Target Surat -->
        <div class="target-section" id="targetSection">
            <div class="envelope">
                <div class="heart-seal">❤️</div>
            </div>
            <div class="envelope-text">❤ From Me For You ❤</div>
        </div>

        <!-- Busur Panah -->
        <div class="bow-section" id="bowSection" onclick="shootArrow()">
            <div class="bow-wrapper">
                <div class="bow-arc"></div>
                <div class="string"></div>
                <div class="arrow" id="arrow"></div>
            </div>
            <div class="click-hint">Tekan busur untuk memanah surat !</div>
        </div>

        <!-- Kartu Pesan Rahasia -->
        <div class="card-popup" id="cardPopup">
            <h2 id="cardTitle">Do you want to be my girlfriend? ♡</h2>
            <div class="cat-gif">🐱❤️</div>
            <div class="btn-group" id="btnGroup">
                <button class="btn btn-yes" onclick="acceptLove()">YES</button>
                <button class="btn btn-no" id="btnNo" onmouseover="moveNoButton()" onclick="moveNoButton()">NO</button>
            </div>
        </div>
    </div>

    <script>
        // Membuat animasi elemen hati di background secara acak
        const heartsBg = document.getElementById('hearts-bg');
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '♥';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heartsBg.appendChild(heart);
        }

        // Fungsi Memanah Surat
        function shootArrow() {
            const arrow = document.getElementById('arrow');
            const targetSection = document.getElementById('targetSection');
            const bowSection = document.getElementById('bowSection');
            const cardPopup = document.getElementById('cardPopup');

            // 1. Panah meluncur ke atas menembak surat
            arrow.style.transform = 'translateY(-320px)';

            setTimeout(() => {
                // 2. Surat dan busur menghilang
                targetSection.style.opacity = '0';
                targetSection.style.transform = 'scale(0)';
                bowSection.style.opacity = '0';
                bowSection.style.pointerEvents = 'none';

                setTimeout(() => {
                    targetSection.style.display = 'none';
                    bowSection.style.display = 'none';

                    // 3. Tampilkan kartu pertanyaan
                    cardPopup.style.display = 'block';
                }, 400);
            }, 350);
        }

        // Fungsi Tombol NO Menghindar/Kabur
        function moveNoButton() {
            const btnNo = document.getElementById('btnNo');
            const x = (Math.random() - 0.5) * 200;
            const y = (Math.random() - 0.5) * 200;

            btnNo.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Fungsi Ketika Tombol YES Ditekan
        function acceptLove() {
            const cardTitle = document.getElementById('cardTitle');
            const btnGroup = document.getElementById('btnGroup');

            cardTitle.innerHTML = `
                <span style="font-size: 20px; font-weight: bold; color: #c9184a;">Yayyy! I love you so much ♡</span><br><br>
                <p style="font-size: 13px; font-weight: normal; color: #555; line-height: 1.6; text-align: center;">
                    Terima kasih sudah menerimaku! Setiap momen bersamamu selalu terasa istimewa. 
                    Aku berjanji akan berusaha membuatmu bahagia setiap hari. Mari kita buat cerita indah bersama! 💖
                </p>
            `;
            btnGroup.style.display = 'none';
        }
    </script>
</body>
</html>
